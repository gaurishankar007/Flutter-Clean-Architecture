name: clean_architecture
description: A comprehensive guide to building scalable and maintainable Flutter applications using Architecture patterns and design Principles.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.47.0"

dependencies:
  alice: ^1.11.0
  alice_dio: ^1.3.3
  auto_route: ^11.2.0
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  encrypt: ^5.0.3
  equatable: ^2.1.0
  firebase_auth: ^7.0.0
  firebase_crashlytics: ^6.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_hooks: ^0.21.3+1
  flutter_sliding_toast: ^1.7.0
  flutter_web_plugins:
    sdk: flutter
  get_it: ^9.3.0
  google_sign_in: ^7.2.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  injectable: ^3.0.0
  material_ui: ^1.7.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  auto_route_generator: ^10.6.0
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  leancode_lint: ^27.0.0
  mocktail: ^1.0.5
  patrol: ^4.10.0
  patrol_finders: ^3.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

    - family: AppIcon
      fonts:
        - asset: assets/icons/AppIcon.ttf

patrol:
  app_name: cleanArchitecture
  flavor: development
  android:
    package_name: com.example.cleanArchitecture
  ios:
    bundle_id: com.example.cleanArchitecture
