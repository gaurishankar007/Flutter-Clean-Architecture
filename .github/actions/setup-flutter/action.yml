name: "Setup Flutter"
description: "Setup java, flutter, and install dependencies."

runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: "temurin"
        java-version: 17
        cache: "gradle"

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: "stable"
        flutter-version: 3.47.7
        cache: true

    - name: Install Dependencies
      shell: bash
      run: flutter pub get
